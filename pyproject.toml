[project]
name = "noplanb"
version = "0.1.0"
description = "An open-source AI execution engine that replaces passive planning with durable, air-gapped cognitive accountability."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Adnan", email = "adnan@noplanb.local" }]
keywords = ["productivity", "ai", "gemma", "temporal", "open-source", "second-brain"]

dependencies = [
    # Temporal durable workflow engine
    "temporalio>=1.9.0",

    # Local LLM via Ollama (OpenAI-compatible endpoint)
    "openai>=1.30.0",

    # FastAPI web server + async support
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Markdown vault I/O (Obsidian-compatible front-matter)
    "python-frontmatter>=1.1.0",

    # Environment variable loading
    "python-dotenv>=1.0.1",

    # Sentry observability (AI Agent Tracing)
    "sentry-sdk[openai]>=2.64.0",

    # Lightweight vector store for journal retrieval
    "faiss-cpu>=1.8.0",

    # Sentence embeddings for vault retrieval
    "sentence-transformers>=3.0.0",

    # Pydantic for typed config and payloads
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Async HTTP client for Telegram nudges (optional)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
noplanb-worker = "temporal_app.worker:main"
noplanb-api    = "api.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ai*", "temporal_app*", "api*"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
